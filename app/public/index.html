<!DOCTYPE html>
<!--
  Page d'accueil de la version web (export « single » : une seule page,
  le routage se fait dans le navigateur). Expo y ajoute la feuille de
  style et le script de l'application.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Penderie</title>
    <meta name="description" content="Penderie : l'inventaire de tes objets et de tes vêtements, rangés par logement, pièce et carton ; ton look du jour, et ce que tes amis choisissent de te montrer." />
    <meta name="theme-color" content="#F8FAFC" />
    <!-- Le reset recommandé par react-native-web : https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Penderie a besoin de JavaScript pour fonctionner.</noscript>
    <div id="root"></div>
  </body>
</html>
