security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Le compte est l'identifiant de connexion ; le profil qui agit est
        # choisi par requête (en-tête X-Profile, voir CurrentProfile).
        accounts:
            entity:
                class: App\Entity\Identity\Account
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Connexion : email + mot de passe → jeton d'accès (15 min) + jeton de
        # rafraîchissement. Sans état : aucune session côté serveur.
        login:
            pattern: ^/api/auth/login$
            stateless: true
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            entry_point: jwt
            jwt: ~
            refresh_jwt:
                check_path: /api/auth/refresh

    access_control:
        - { path: ^/api/auth/(login|refresh|register)$, roles: PUBLIC_ACCESS }
        # Un lien de partage s'ouvre sans compte (lecture seule, voir LinkController).
        - { path: ^/api/links/, roles: PUBLIC_ACCESS }
        # La documentation de l'API reste consultable sans jeton.
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
