security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Le compte est l'identifiant de connexion ; le profil qui agit est
        # choisi par requête (en-tête X-Profile, voir CurrentProfile).
        accounts:
            entity:
                class: App\Entity\Identity\Account
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Connexion : email + mot de passe → jeton d'accès (15 min) + jeton de
        # rafraîchissement. Sans état : aucune session côté serveur.
        login:
            pattern: ^/api/auth/login$
            stateless: true
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Back-office (Twig) : une session, un formulaire, réservé aux comptes
        # ROLE_ADMIN. AdminUserChecker refuse les autres dès la connexion.
        admin:
            pattern: ^/admin
            lazy: true
            provider: accounts
            user_checker: App\Security\AdminUserChecker
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin_dashboard
                always_use_default_target_path: false
                username_parameter: email
                password_parameter: password
                enable_csrf: true
            logout:
                path: admin_logout
                target: admin_login
            # Après le mot de passe, le code de l'application d'authentification.
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                enable_csrf: true

        api:
            pattern: ^/api
            stateless: true
            entry_point: jwt
            jwt: ~
            refresh_jwt:
                check_path: /api/auth/refresh

    access_control:
        - { path: ^/admin/connexion$, roles: PUBLIC_ACCESS }
        # Entre le mot de passe et le code : seulement l'écran du code.
        - { path: ^/admin/(2fa|2fa_check)$, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        # La déconnexion reste ouverte, connecté ou pendant l'étape du code
        # (IS_AUTHENTICATED_2FA_IN_PROGRESS refusait un administrateur déjà connecté).
        - { path: ^/admin/deconnexion$, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/api/auth/(login|refresh|register)$, roles: PUBLIC_ACCESS }
        # Un lien de partage s'ouvre sans compte (lecture seule, voir LinkController).
        - { path: ^/api/links/, roles: PUBLIC_ACCESS }
        # La documentation de l'API reste consultable sans jeton.
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
