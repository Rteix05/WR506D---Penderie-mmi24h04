; Réglages PHP propres à Penderie, montés dans le conteneur (compose.yaml).
;
; Envoi de photos (scan) : PHP limite les fichiers à 2 Mo par défaut, moins
; qu'une photo de téléphone. L'API accepte 8 Mo (ScanController) ; marge
; pour le reste du formulaire multipart.
upload_max_filesize = 10M
post_max_size = 12M

; Couverture du code (séance 16) : l'extension pcov est installée dans
; l'image mais éteinte, pour ne pas ralentir chaque requête. make coverage
; l'allume pour la seule durée de la suite PHPUnit (-d pcov.enabled=1).
pcov.enabled = 0
