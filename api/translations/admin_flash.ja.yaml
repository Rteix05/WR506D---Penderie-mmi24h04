# Messages du back-office écrits en français dans le code (messages flash,
# erreurs métier) : la clé est le texte français, affiché tel quel en français.
"Litige pris en charge.": "紛争の担当になりました。"
"Ce litige est déjà clos.": "この紛争はすでに終了しています。"
"Choisis une décision et explique-la (1 000 caractères au plus) : les deux parties la liront.": "判断を選び、その理由を書いてください（最大1,000文字）。双方が読みます。"
"Litige clos. ": "紛争を終了しました。"
"Litige clos. Le remboursement se fait chez le prestataire de paiement.": "紛争を終了しました。返金は決済代行会社で行われます。"
"La page a expiré : recharge-la et réessaie.": "ページの有効期限が切れました。再読み込みしてもう一度お試しください。"
"Signalement pris en charge.": "通報の担当になりました。"
"Choisis une décision.": "判断を選んでください。"
"Décision appliquée et inscrite au journal.": "判断を適用し、記録に残しました。"
"Ce code ne correspond pas. Vérifie l’heure du téléphone et saisis le code affiché maintenant.": "コードが一致しません。スマートフォンの時刻を確認し、いま表示されているコードを入力してください。"
"Double authentification activée : elle sera demandée à chaque connexion.": "二段階認証を有効にしました。ログインのたびに求められます。"
"Compte suspendu : ses profils ne peuvent plus utiliser l’application.": "アカウントを停止しました。そのプロフィールはアプリを使えなくなります。"
"Compte réactivé.": "アカウントを再開しました。"
"Ce compte est déjà suspendu.": "このアカウントはすでに停止されています。"
"Durée de suspension inconnue.": "不明な停止期間です。"
"Ce compte n'est pas suspendu.": "このアカウントは停止されていません。"
"Le compte fantôme ne se modère pas.": "ゴーストアカウントはモデレートできません。"
"On ne se suspend pas soi-même.": "自分自身を停止することはできません。"
"Le motif est obligatoire (500 caractères au plus) : il reste dans le journal.": "理由は必須です（最大500文字）。記録に残ります。"
"La note est obligatoire (1 000 caractères au plus) : elle reste dans le journal.": "メモは必須です（最大1,000文字）。記録に残ります。"
"Ce signalement est déjà traité.": "この通報はすでに対応済みです。"
"Le contenu signalé n'existe plus : classe le signalement.": "通報されたコンテンツはもう存在しません。通報を却下してください。"
"Décision inconnue.": "不明な判断です。"
"Ce contenu ne se masque pas (ou l'est déjà) : avertis ou suspends son auteur.": "このコンテンツは非表示にできません（またはすでに非表示です）。投稿者に警告するか、停止してください。"
"Ce contenu ne se masque pas : avertis ou suspends son auteur.": "このコンテンツは非表示にできません。投稿者に警告するか、停止してください。"
"Contenu supprimé": "削除されたコンテンツ"
"Publication sans texte": "本文のない投稿"
"Masquer le commentaire": "コメントを非表示にする"
"Retirer la publication": "投稿を取り下げる"
"Retirer l’annonce": "出品を取り下げる"
"Masquer": "非表示にする"
"Décision de l'IA validée.": "AIの決定を承認しました。"
"Décision de l'IA annulée : le signalement est rouvert à ton nom.": "AIの決定を取り消しました。通報はあなたの担当で再開されました。"
"L'IA a appliqué sa décision : tu peux la valider ou l'annuler.": "AIが決定を適用しました。承認または取り消しができます。"
"L'IA a rendu son analyse : à toi de décider.": "AIの分析が完了しました。判断はあなたです。"
"L'analyse IA a échoué : le détail est dans le journal.": "AIの分析に失敗しました。詳細はログにあります。"
"Seule une décision appliquée par l'IA se valide.": "承認できるのはAIが適用した決定のみです。"
"Seule une décision appliquée par l'IA s'annule.": "取り消せるのはAIが適用した決定のみです。"
"Explique l'erreur de l'IA (1 000 caractères au plus) : elle reste au journal.": "AIの誤りを説明してください（1000文字以内）。ログに残ります。"
"Seul un commentaire masqué par l'IA se rétablit ici.": "ここで元に戻せるのはAIが非表示にしたコメントのみです。"
"Catégorie ajoutée.": "カテゴリーを追加しました。"
"Catégorie renommée.": "カテゴリー名を変更しました。"
"Catégorie supprimée.": "カテゴリーを削除しました。"
"Marque ajoutée.": "ブランドを追加しました。"
"Marque validée : elle rejoint la liste de tous.": "ブランドを承認しました。全員のリストに加わります。"
"Marque renommée.": "ブランド名を変更しました。"
"Marques fusionnées : les vêtements portent maintenant la marque choisie.": "ブランドを統合しました。衣類は選んだブランドになりました。"
"Marque supprimée.": "ブランドを削除しました。"
"Une catégorie de ce nom existe déjà.": "同じ名前のカテゴリーがすでにあります。"
"Une sous-catégorie se range sous une catégorie principale de l'application.": "サブカテゴリーはアプリのメインカテゴリーの下に作成します。"
"Des biens sont rangés dans cette catégorie : renomme-la plutôt.": "このカテゴリーにはアイテムがあります。名前の変更にしてください。"
"Cette catégorie a des sous-catégories : supprime-les d'abord.": "サブカテゴリーがあります。先にそちらを削除してください。"
"Des vêtements portent cette marque : fusionne-la dans une autre plutôt.": "このブランドの衣類があります。別のブランドに統合してください。"
"Le nom fait de 1 à 80 caractères.": "名前は1〜80文字です。"
"Choisis la marque qui la remplace.": "置き換えるブランドを選んでください。"
"Choisis une autre marque.": "別のブランドを選んでください。"
